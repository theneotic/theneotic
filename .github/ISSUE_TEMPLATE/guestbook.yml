name: Sign the guestbook
description: Leave a short public note for THE // NEOTIC.
title: "Guestbook: "
labels:
  - guestbook-pending
body:
  - type: markdown
    attributes:
      value: |
        ## Sign the midnight ledger
        Leave a short, kind note. Approved entries appear in the public profile guestbook.
  - type: input
    id: display_name
    attributes:
      label: Display name
      description: The name you want shown publicly.
      placeholder: Your name or GitHub handle
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location or role
      description: Optional. Keep it short.
      placeholder: Mumbai, India · Product designer
    validations:
      required: false
  - type: textarea
    id: note
    attributes:
      label: Leave a note
      description: A short public message for the guestbook.
      placeholder: Great profile — the midnight instrument clock is a thoughtful touch.
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: Public note
      options:
        - label: I understand this note may be displayed publicly after approval.
          required: true
