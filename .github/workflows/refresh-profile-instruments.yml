name: Refresh profile instruments

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-clock.mjs"
      - ".github/workflows/refresh-profile-instruments.yml"

permissions:
  contents: write

concurrency:
  group: profile-instruments
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Synchronize the latest main branch
        run: git pull --rebase origin main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Refresh Indian Standard Time instrument
        run: node scripts/generate-clock.mjs assets/instruments/ist-clock.svg

      - name: Build contribution run
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/activity/contribution-run.svg?color_snake=%23A78BFA&color_dots=%230B1120,%23172554,%231D4ED8,%2360A5FA,%23BFDBFE

      - name: Commit refreshed profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/instruments/ist-clock.svg assets/activity/contribution-run.svg
          git diff --cached --quiet || git commit -m "Refresh profile instruments"
          git push origin HEAD:main
