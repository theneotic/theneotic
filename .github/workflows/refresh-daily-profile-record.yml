name: Refresh Daily Profile Record

# Scheduled workflows execute from the repository default branch. This file is
# designed to run there while checking out and updating the Glyph Ledger sub2 branch.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-profile-record:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Glyph Ledger branch
        uses: actions/checkout@v4
        with:
          ref: sub2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh the daily public record and visitor heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh_profile_record.mjs --username theneotic --profile-repo theneotic/theneotic

      - name: Commit only changed profile data as theneotic
        run: |
          git config user.name "theneotic"
          git config user.email "157010181+theneotic@users.noreply.github.com"
          git add README.md data/visitor-activity.json assets/visitor-activity-heatmap.svg
          git diff --cached --quiet || git commit -m "chore: refresh daily profile record"
          git push origin HEAD:sub2
