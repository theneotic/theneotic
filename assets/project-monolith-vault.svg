<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title desc">
  <title id="title">NODE_01 // MONOLITH VAULT</title>
  <desc id="desc">Client-side cryptographic security utility and password entropy analyzer.</desc>

  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>

    <!-- Ambient Cyan Radial Glow -->
    <radialGradient id="cyan-glow" cx="75%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.22"/>
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0A0B0E" stop-opacity="0"/>
    </radialGradient>

    <!-- Technical 20px Grid -->
    <pattern id="grid-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#1F2430" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="340" fill="#0A0B0E"/>

  <!-- Ambient Glow -->
  <rect width="600" height="340" fill="url(#cyan-glow)"/>

  <!-- Technical Grid Overlay -->
  <rect x="8" y="8" width="584" height="324" rx="8" fill="url(#grid-dots)"/>

  <!-- Outer Spec Frame -->
  <rect x="8" y="8" width="584" height="324" rx="8" fill="none" stroke="#1F2430" stroke-width="1.2"/>

  <!-- Corner Registration Crosshairs -->
  <g stroke="#00E5FF" stroke-width="1.2" opacity="0.8">
    <path d="M 18 18 L 18 26 M 18 18 L 26 18"/>
    <path d="M 582 18 L 582 26 M 582 18 L 574 18"/>
    <path d="M 18 322 L 18 314 M 18 322 L 26 322"/>
    <path d="M 582 322 L 582 314 M 582 322 L 574 322"/>
  </g>

  <!-- Top Metadata Bar -->
  <g class="mono" font-size="10" letter-spacing="1.2">
    <text x="24" y="34" fill="#00E5FF" font-weight="700">NODE_01 // CRYPTO SECURITY</text>
    <circle cx="536" cy="31" r="3" fill="#10B981"/>
    <text x="544" y="34" fill="#10B981" font-weight="700">PROD</text>
  </g>
  <line x1="24" y1="46" x2="576" y2="46" stroke="#1F2430" stroke-width="1"/>

  <!-- Technical Subtitle Spec -->
  <text x="24" y="82" class="mono" font-size="11" font-weight="600" fill="#71717A" letter-spacing="1.5">
    CLIENT-SIDE CRYPTOGRAPHIC ENGINE // ZERO SUPPLY-CHAIN RISK
  </text>

  <!-- Project Title -->
  <text x="24" y="126" class="sans" font-size="32" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
    MONOLITH VAULT
  </text>

  <!-- Pitch Statement -->
  <text x="24" y="162" class="sans" font-size="13" font-weight="400" fill="#E4E4E7" letter-spacing="0.1">
    Client-side cryptographic security utility and password entropy
  </text>
  <text x="24" y="182" class="sans" font-size="13" font-weight="400" fill="#E4E4E7" letter-spacing="0.1">
    analysis workbench operating 100% within the browser sandbox.
  </text>

  <!-- Architectural Proof Tag -->
  <g transform="translate(24, 214)">
    <rect width="552" height="38" rx="4" fill="#0E121A" stroke="#1F2430" stroke-width="1"/>
    <text x="14" y="24" class="mono" font-size="10.5" fill="#94A3B8">
      PROOF: <tspan fill="#00E5FF">Zero npm dependencies · Native WebCrypto primitives</tspan>
    </text>
  </g>

  <!-- Bottom Hardware Spec Pills -->
  <g transform="translate(24, 280)" class="mono" font-size="10" font-weight="600" letter-spacing="0.8">
    <rect x="0" y="0" width="134" height="26" rx="4" fill="#111318" stroke="#1F2430" stroke-width="1"/>
    <text x="12" y="17" fill="#00E5FF">WEBCRYPTO API</text>

    <rect x="142" y="0" width="128" height="26" rx="4" fill="#111318" stroke="#1F2430" stroke-width="1"/>
    <text x="12" y="17" fill="#F3F4F6" dx="142">0-DEP VANILLA</text>

    <rect x="278" y="0" width="108" height="26" rx="4" fill="#111318" stroke="#1F2430" stroke-width="1"/>
    <text x="12" y="17" fill="#10B981" dx="278">AUDITED</text>

    <!-- Source Link Action -->
    <text x="500" y="17" fill="#71717A" font-size="11">INSPECT ↗</text>
  </g>
