<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="126" viewBox="0 0 1060 126" role="img" aria-labelledby="title desc">
  <title id="title">NODE_02 // F1 LIVE TELEMETRY HUD</title>
  <desc id="desc">High-frequency streaming race telemetry ingestion pipeline with deterministic lap-delta timing.</desc>

  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.9); }
      }
      .dot-pulse { animation: pulse-dot 1.8s ease-in-out infinite; }
    </style>

    <!-- Ambient Red Radial Glow -->
    <radialGradient id="red-ambient" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2A2A" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0A0B0E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1060" height="126" fill="#0A0B0E"/>

  <!-- Rack Chassis Shell -->
  <rect x="6" y="6" width="1048" height="114" rx="4" fill="#0E1016" stroke="#1F2430" stroke-width="1.2"/>
  <rect x="6" y="6" width="1048" height="114" rx="4" fill="url(#red-ambient)"/>

  <!-- Rack Mount Ear Screws -->
  <circle cx="20" cy="63" r="3.5" fill="#161922" stroke="#2B3245" stroke-width="1"/>
  <circle cx="1040" cy="63" r="3.5" fill="#161922" stroke="#2B3245" stroke-width="1"/>

  <!-- Corner Reticles -->
  <g stroke="#FF2A2A" stroke-width="1" opacity="0.8">
    <path d="M 32 16 L 32 22 M 32 16 L 38 16"/>
    <path d="M 1028 16 L 1028 22 M 1028 16 L 1022 16"/>
    <path d="M 32 110 L 32 104 M 32 110 L 38 110"/>
    <path d="M 1028 110 L 1028 104 M 1028 110 L 1022 110"/>
  </g>

  <!-- ================= LEFT: IDENTITY & DOMAIN ================= -->
  <g transform="translate(42, 0)">
    <!-- Node Spec Pill -->
    <text x="0" y="32" class="mono" font-size="10.5" font-weight="700" fill="#FF2A2A" letter-spacing="1.5">NODE_02 // TELEMETRY PIPELINE</text>
    
    <!-- Main Title -->
    <text x="0" y="62" class="sans" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.3">F1 TELEMETRY HUD</text>
    
    <!-- Subtitle Spec -->
    <text x="0" y="84" class="sans" font-size="12" font-weight="500" fill="#94A3B8">High-Frequency Race Pipeline &amp; Live HUD</text>

    <!-- Bottom Hash Indicator -->
    <text x="0" y="104" class="mono" font-size="9.5" fill="#64748B" letter-spacing="1">UDP/REST · 60HZ-LOCKED · DETERMINISTIC</text>
  </g>

  <!-- Divider 1 -->
  <line x1="330" y1="16" x2="330" y2="110" stroke="#1F2430" stroke-width="1"/>

  <!-- ================= CENTER: ARCHITECTURAL PROOF BAY ================= -->
  <g transform="translate(346, 0)">
    <!-- Recessed Spec Box -->
    <rect x="0" y="16" width="460" height="94" rx="3" fill="#07080B" stroke="#1A1E29" stroke-width="1"/>
    
    <!-- Header: Bottleneck Solved -->
    <g transform="translate(14, 34)">
      <text x="0" y="0" class="mono" font-size="9.5" font-weight="700" fill="#FF2A2A" letter-spacing="1">ARCHITECTURAL PROOF // BOTTLENECK SOLVED</text>
      <text x="0" y="18" class="sans" font-size="12" font-weight="400" fill="#E2E8F0">Processed high-rate telemetry into real-time differential delta</text>
      <text x="0" y="34" class="sans" font-size="12" font-weight="400" fill="#E2E8F0">and tire wear models on HTML5 Canvas without UI frame drops.</text>
    </g>

    <!-- Hardware Spec Pills -->
    <g transform="translate(14, 88)" class="mono" font-size="9" font-weight="600" letter-spacing="0.5">
      <rect x="0" y="0" width="76" height="18" rx="2" fill="#11141C" stroke="#1E2433" stroke-width="1"/>
      <text x="8" y="12" fill="#FF2A2A">PYTHON</text>

      <rect x="82" y="0" width="86" height="18" rx="2" fill="#11141C" stroke="#1E2433" stroke-width="1"/>
      <text x="8" y="12" fill="#00E5FF" dx="82">TYPESCRIPT</text>

      <rect x="174" y="0" width="98" height="18" rx="2" fill="#11141C" stroke="#1E2433" stroke-width="1"/>
      <text x="8" y="12" fill="#F3F4F6" dx="174">HTML5 CANVAS</text>

      <rect x="278" y="0" width="94" height="18" rx="2" fill="#11141C" stroke="#1E2433" stroke-width="1"/>
      <text x="8" y="12" fill="#10B981" dx="278">60HZ STREAM</text>
    </g>
  </g>

  <!-- Divider 2 -->
  <line x1="822" y1="16" x2="822" y2="110" stroke="#1F2430" stroke-width="1"/>

  <!-- ================= RIGHT: TELEMETRY & ACTION BAY ================= -->
  <g transform="translate(838, 0)">
    <!-- Production Status -->
    <circle cx="6" cy="30" r="3" fill="#10B981" class="dot-pulse"/>
    <text x="16" y="33" class="mono" font-size="10" font-weight="700" fill="#10B981" letter-spacing="1">VERIFIED PRODUCTION</text>

    <!-- Telemetry Readout -->
    <text x="0" y="52" class="mono" font-size="9.5" fill="#71717A">PIPELINE: <tspan fill="#F3F4F6">60Hz LOCKED</tspan></text>
    <text x="0" y="67" class="mono" font-size="9.5" fill="#71717A">RENDER: <tspan fill="#F3F4F6">DETERMINISTIC</tspan></text>

    <!-- Action Button Box -->
    <g transform="translate(0, 78)">
      <rect width="180" height="28" rx="3" fill="#1C1014" stroke="#FF2A2A" stroke-width="1"/>
      <text x="90" y="18" class="mono" font-size="11" font-weight="700" fill="#FF2A2A" letter-spacing="1" text-anchor="middle">INSPECT SOURCE ↗</text>
    </g>
  </g>
</svg>
