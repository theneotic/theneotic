<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="title desc">
  <title id="title">NODE_02 // F1 LIVE TELEMETRY HUD</title>
  <desc id="desc">High-frequency streaming race telemetry ingestion pipeline with deterministic lap-delta timing.</desc>

  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.9); }
      }
      .dot-pulse { animation: pulse-dot 1.8s ease-in-out infinite; }
    </style>

    <!-- Ambient Red Radial Glow -->
    <radialGradient id="red-glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FF2A2A" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0A0B0E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="240" fill="#0A0B0E"/>

  <!-- Chassis Shell -->
  <rect x="6" y="6" width="628" height="228" rx="4" fill="#0E1016" stroke="#1F2430" stroke-width="1.2"/>
  <rect x="6" y="6" width="628" height="228" rx="4" fill="url(#red-glow)"/>

  <!-- Corner Reticles -->
  <g stroke="#FF2A2A" stroke-width="1" opacity="0.8">
    <path d="M 18 16 L 18 24 M 18 16 L 26 16"/>
    <path d="M 622 16 L 622 24 M 622 16 L 614 16"/>
    <path d="M 18 224 L 18 216 M 18 224 L 26 224"/>
    <path d="M 622 224 L 622 216 M 622 224 L 614 224"/>
  </g>

  <!-- Top Metadata Bar -->
  <g class="mono" font-size="10" letter-spacing="1">
    <text x="24" y="28" fill="#FF2A2A" font-weight="700">NODE_02 // TELEMETRY PIPELINE</text>
    <circle cx="536" cy="25" r="3" fill="#10B981" class="dot-pulse"/>
    <text x="546" y="28" fill="#10B981" font-weight="700">VERIFIED PROD</text>
  </g>
  <line x1="24" y1="36" x2="616" y2="36" stroke="#1F2430" stroke-width="1"/>

  <!-- Title & Domain -->
  <text x="24" y="66" class="sans" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="-0.3">F1 TELEMETRY HUD</text>
  <text x="24" y="86" class="sans" font-size="12" font-weight="500" fill="#94A3B8">High-Frequency Race Pipeline &amp; Live Telemetry HUD</text>

  <!-- Central Proof Box -->
  <g transform="translate(24, 102)">
    <rect width="592" height="74" rx="3" fill="#07080B" stroke="#1A1E29" stroke-width="1"/>
    <text x="12" y="20" class="mono" font-size="9.5" font-weight="700" fill="#FF2A2A" letter-spacing="0.8">ARCHITECTURAL PROOF // BOTTLENECK SOLVED</text>
    <text x="12" y="40" class="sans" font-size="11.5" fill="#E2E8F0">Processed high-rate race telemetry into deterministic lap-delta</text>
    <text x="12" y="58" class="sans" font-size="11.5" fill="#E2E8F0">and tire wear models on HTML5 Canvas without UI frame drops.</text>
  </g>

  <!-- Bottom Hardware Spec Strip -->
  <g transform="translate(24, 196)" class="mono" font-size="9.5" font-weight="600" letter-spacing="0.5">
    <rect x="0" y="0" width="76" height="22" rx="2" fill="#11141C" stroke="#1E2433" stroke-width="1"/>
    <text x="8" y="15" fill="#FF2A2A">PYTHON</text>

    <rect x="84" y="0" width="86" height="22" rx="2" fill="#11141C" stroke="#1E2433" stroke-width="1"/>
    <text x="8" y="15" fill="#00E5FF" dx="84">TYPESCRIPT</text>

    <rect x="178" y="0" width="102" height="22" rx="2" fill="#11141C" stroke="#1E2433" stroke-width="1"/>
    <text x="8" y="15" fill="#F3F4F6" dx="178">HTML5 CANVAS</text>

    <rect x="288" y="0" width="94" height="22" rx="2" fill="#11141C" stroke="#1E2433" stroke-width="1"/>
    <text x="8" y="15" fill="#10B981" dx="288">60HZ STREAM</text>

    <!-- Action Button -->
    <g transform="translate(442, 0)">
      <rect width="150" height="22" rx="2" fill="#1C1014" stroke="#FF2A2A" stroke-width="1"/>
      <text x="75" y="15" fill="#FF2A2A" font-size="10" font-weight="700" letter-spacing="0.8" text-anchor="middle">INSPECT SOURCE ↗</text>
    </g>
  </g>
</svg>
