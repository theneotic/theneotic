<svg xmlns="http://www.w3.org/2000/svg" width="760" height="156" viewBox="0 0 760 156" role="img" aria-labelledby="title desc">
  <title id="title">Spotify activity signal</title>
  <desc id="desc">A terminal-style Spotify activity card that indicates a live listening connection has not yet been configured.</desc>
  <rect width="760" height="156" rx="14" fill="#0B1120"/>
  <rect x="0.5" y="0.5" width="759" height="155" rx="13.5" fill="none" stroke="#30363D"/>
  <circle cx="69" cy="78" r="31" fill="none" stroke="#64C8FF" stroke-width="4"/>
  <path d="M49 68c13-5 28-4 39 1M49 80c13-5 28-4 39 1M51 92c11-4 24-3 33 1" fill="none" stroke="#64C8FF" stroke-linecap="round" stroke-width="4"/>
  <text x="124" y="47" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">AUDIO SIGNAL / SPOTIFY</text>
  <text x="124" y="82" fill="#E6EDF3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" font-weight="700">PLAYBACK FEED NOT CONNECTED</text>
  <text x="124" y="111" fill="#8B949E" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">LIVE TRACK DATA WILL APPEAR ONLY AFTER ACCOUNT AUTHORIZATION</text>
  <rect x="596" y="42" width="132" height="34" rx="17" fill="#1F3A4C"/>
  <text x="662" y="64" fill="#64C8FF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" text-anchor="middle">READY / PRIVATE</text>
  <text x="662" y="111" fill="#FF7A59" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">OPEN SPOTIFY ↗</text>
</svg>
