<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="280" viewBox="0 0 1060 280" role="img" aria-labelledby="title desc">
  <title id="title">The-Neotic // Engineering Spec Sheet &amp; Telemetry Header</title>
  <desc id="desc">Industrial systems architecture header with active telemetry readout, high-contrast typography, and boot sequence.</desc>

  <defs>
    <style>
      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; r: 3.5; }
        50% { opacity: 0.35; r: 2.8; }
      }
      .cursor { animation: cursor-blink 0.9s step-start infinite; }
      .status-pulse { animation: pulse-dot 1.8s ease-in-out infinite; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>

    <!-- Technical 24px Dot Matrix Grid -->
    <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#1F2430" opacity="0.85"/>
    </pattern>

    <!-- Terminal Box Gradient -->
    <linearGradient id="term-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E121A"/>
      <stop offset="100%" stop-color="#07080A"/>
    </linearGradient>

    <!-- Signal Accent Gradient -->
    <linearGradient id="red-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2A2A"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1060" height="280" fill="#0A0B0E"/>

  <!-- Blueprint Dot Grid Overlay -->
  <rect x="10" y="10" width="1040" height="260" fill="url(#dot-grid)"/>

  <!-- Outer Spec Frame -->
  <rect x="10" y="10" width="1040" height="260" fill="none" stroke="#1F2430" stroke-width="1.5"/>

  <!-- Industrial Corner Registration Marks (┌ ┐ └ ┘) -->
  <g stroke="#FF2A2A" stroke-width="1.5" fill="none">
    <!-- Top-Left -->
    <path d="M 10 22 L 22 22 L 22 10"/>
    <path d="M 16 16 L 16 26 M 16 16 L 26 16"/>
    <!-- Top-Right -->
    <path d="M 1050 22 L 1038 22 L 1038 10"/>
    <path d="M 1044 16 L 1044 26 M 1044 16 L 1034 16"/>
    <!-- Bottom-Left -->
    <path d="M 10 258 L 22 258 L 22 270"/>
    <path d="M 16 264 L 16 254 M 16 264 L 26 264"/>
    <!-- Bottom-Right -->
    <path d="M 1050 258 L 1038 258 L 1038 270"/>
    <path d="M 1044 264 L 1044 254 M 1044 264 L 1034 264"/>
  </g>

  <!-- ================= TOP SPEC BAR ================= -->
  <line x1="10" y1="42" x2="1050" y2="42" stroke="#1F2430" stroke-width="1"/>

  <g class="mono" font-size="11" font-weight="600" letter-spacing="1.2">
    <!-- Left Spec ID -->
    <text x="28" y="31" fill="#71717A">SPEC.DOC // <tspan fill="#F3F4F6">THENEOTIC-CORE-2026</tspan></text>

    <!-- Center Status Indicator -->
    <text x="375" y="31" fill="#71717A">STATUS: [ </text>
    <circle cx="448" cy="27.5" r="3.5" fill="#10B981" class="status-pulse"/>
    <text x="460" y="31" fill="#10B981" font-weight="700">ONLINE // ALL SYSTEMS NOMINAL</text>
    <text x="696" y="31" fill="#71717A"> ]</text>

    <!-- Right Telemetry Coordinates -->
    <text x="825" y="31" fill="#71717A">LOC: <tspan fill="#F3F4F6">19°04'N 72°52'E</tspan> [BOM-IN]</text>
  </g>

  <!-- ================= MAIN LEFT BLOCK ================= -->
  <g transform="translate(28, 0)">
    <!-- Red Overline Tag -->
    <text x="0" y="74" class="mono" font-size="11.5" font-weight="700" fill="#FF2A2A" letter-spacing="2">// SYSTEMS &amp; AI ARCHITECTURE</text>

    <!-- Main Identity Header -->
    <text x="0" y="116" class="sans" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      The-Neotic
      <tspan dx="12" class="mono" font-size="20" font-weight="500" fill="#94A3B8">@theneotic</tspan>
    </text>

    <!-- Blueprint Hairline Accent -->
    <line x1="0" y1="128" x2="520" y2="128" stroke="#1F2430" stroke-width="1"/>
    <rect x="0" y="127" width="56" height="2" fill="url(#red-accent)"/>

    <!-- Crisp, Bold Manifesto -->
    <text x="0" y="154" class="sans" font-size="13.5" font-weight="500" fill="#CBD5E1" letter-spacing="0.15">
      Building local-first AI engines, zero-dependency web primitives, and real-time telemetry.
    </text>
    <text x="0" y="176" class="sans" font-size="13.5" font-weight="500" fill="#CBD5E1" letter-spacing="0.15">
      Verified through inspectable source code, deterministic state logic, and low-level system design.
    </text>

    <!-- Technical Hardware Pills (Prominently Featuring TS) -->
    <g transform="translate(0, 204)" class="mono" font-size="11" font-weight="600" letter-spacing="0.8">
      <!-- Pill 1: Systems -->
      <rect x="0" y="0" width="134" height="28" rx="4" fill="#111318" stroke="#1F2430" stroke-width="1.2"/>
      <circle cx="12" cy="14" r="3" fill="#FF2A2A"/>
      <text x="22" y="18" fill="#F3F4F6">SYS: C / PY / JVM</text>

      <!-- Pill 2: Web Engine with TS -->
      <rect x="142" y="0" width="144" height="28" rx="4" fill="#111318" stroke="#1F2430" stroke-width="1.2"/>
      <circle cx="154" cy="14" r="3" fill="#00E5FF"/>
      <text x="164" y="18" fill="#00E5FF">WEB: TS · 0-DEP JS</text>

      <!-- Pill 3: Data Backend -->
      <rect x="294" y="0" width="150" height="28" rx="4" fill="#111318" stroke="#1F2430" stroke-width="1.2"/>
      <circle cx="306" cy="14" r="3" fill="#10B981"/>
      <text x="316" y="18" fill="#F3F4F6">DATA: SQL / REALTIME</text>

      <!-- Pill 4: Architecture -->
      <rect x="452" y="0" width="112" height="28" rx="4" fill="#111318" stroke="#1F2430" stroke-width="1.2"/>
      <text x="462" y="18" fill="#94A3B8">ARCH: <tspan fill="#FFFFFF">LOCAL-1ST</tspan></text>
    </g>
  </g>

  <!-- ================= MAIN RIGHT BLOCK (TERMINAL TELEMETRY BOX) ================= -->
  <g transform="translate(600, 52)">
    <!-- Terminal Outer Frame -->
    <rect width="436" height="204" rx="4" fill="url(#term-bg)" stroke="#1F2430" stroke-width="1.2"/>

    <!-- Terminal Header Bar -->
    <rect width="436" height="28" rx="4" fill="#111318"/>
    <line x1="0" y1="28" x2="436" y2="28" stroke="#1F2430" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="16" cy="14" r="3.5" fill="#FF2A2A" opacity="0.9"/>
    <circle cx="28" cy="14" r="3.5" fill="#EAB308" opacity="0.9"/>
    <circle cx="40" cy="14" r="3.5" fill="#10B981" opacity="0.9"/>

    <!-- Terminal Title -->
    <text x="56" y="18" class="mono" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="1">sh // telemetry-exec --target=all</text>
    <text x="350" y="18" class="mono" font-size="10" font-weight="700" fill="#00E5FF" letter-spacing="1">60Hz [LOCKED]</text>

    <!-- Terminal Module Tree -->
    <g class="mono" font-size="11.5" letter-spacing="0.5">
      <!-- Command prompt -->
      <text x="16" y="54" fill="#94A3B8">$ <tspan fill="#FFFFFF" font-weight="700">monolith --inspect --verify</tspan></text>

      <!-- Node 01 -->
      <text x="16" y="80">
        <tspan fill="#64748B">├─ </tspan>
        <tspan fill="#10B981" font-weight="700">[OK] </tspan>
        <tspan fill="#FFFFFF" font-weight="600">kernel.ai.oculus</tspan>
        <tspan fill="#94A3B8" dx="14">(local_weights: mounted)</tspan>
      </text>

      <!-- Node 02 (Featuring TS/JS) -->
      <text x="16" y="106">
        <tspan fill="#64748B">├─ </tspan>
        <tspan fill="#00E5FF" font-weight="700">[OK] </tspan>
        <tspan fill="#FFFFFF" font-weight="600">crypto.vault_core</tspan>
        <tspan fill="#00E5FF" dx="8">(ts/js | 0-dep | audited)</tspan>
      </text>

      <!-- Node 03 -->
      <text x="16" y="132">
        <tspan fill="#64748B">├─ </tspan>
        <tspan fill="#10B981" font-weight="700">[OK] </tspan>
        <tspan fill="#FFFFFF" font-weight="600">stream.f1_telemetry</tspan>
        <tspan fill="#94A3B8" dx="8">(pipeline: 60Hz_locked)</tspan>
      </text>

      <!-- Node 04 -->
      <text x="16" y="158">
        <tspan fill="#64748B">└─ </tspan>
        <tspan fill="#10B981" font-weight="700">[OK] </tspan>
        <tspan fill="#FFFFFF" font-weight="600">runtime.fabric_jvm</tspan>
        <tspan fill="#94A3B8" dx="12">(env: production)</tspan>
      </text>

      <!-- Awaiting instruction prompt with animated cursor -->
      <text x="16" y="186">
        <tspan fill="#00E5FF" font-weight="700">&gt; </tspan>
        <tspan fill="#E4E4E7" font-weight="600">awaiting_instruction</tspan>
        <tspan class="cursor" fill="#FF2A2A" font-weight="700">_</tspan>
      </text>
    </g>

    <!-- Terminal Corner Accent -->
    <path d="M 430 196 L 430 200 L 424 200" stroke="#00E5FF" stroke-width="1.2" fill="none"/>
  </g>
</svg>
