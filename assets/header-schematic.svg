<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" role="img" aria-labelledby="title desc">
  <title id="title">The-Neotic // Engineering Spec Sheet &amp; Telemetry Header</title>
  <desc id="desc">Industrial systems architecture header with active telemetry readout, high-contrast typography, and boot sequence.</desc>

  <defs>
    <style>
      @keyframes cursor-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; r: 3.5; }
        50% { opacity: 0.35; r: 2.8; }
      }
      .cursor { animation: cursor-blink 0.9s step-start infinite; }
      .status-pulse { animation: pulse-dot 1.8s ease-in-out infinite; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>

    <!-- Technical 20px Dot Matrix Grid -->
    <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#1F2430" opacity="0.85"/>
    </pattern>

    <!-- Terminal Box Gradient -->
    <linearGradient id="term-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E121A"/>
      <stop offset="100%" stop-color="#07080A"/>
    </linearGradient>

    <!-- Signal Accent Gradient -->
    <linearGradient id="red-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2A2A"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="320" fill="#0A0B0E"/>

  <!-- Blueprint Dot Grid Overlay -->
  <rect x="8" y="8" width="784" height="304" fill="url(#dot-grid)"/>

  <!-- Outer Spec Frame -->
  <rect x="8" y="8" width="784" height="304" fill="none" stroke="#1F2430" stroke-width="1.2"/>

  <!-- Industrial Corner Registration Marks (┌ ┐ └ ┘) -->
  <g stroke="#FF2A2A" stroke-width="1.2" fill="none">
    <path d="M 8 18 L 18 18 L 18 8"/>
    <path d="M 14 14 L 14 22 M 14 14 L 22 14"/>
    <path d="M 792 18 L 782 18 L 782 8"/>
    <path d="M 786 14 L 786 22 M 786 14 L 778 14"/>
    <path d="M 8 302 L 18 302 L 18 312"/>
    <path d="M 14 306 L 14 298 M 14 306 L 22 306"/>
    <path d="M 792 302 L 782 302 L 782 312"/>
    <path d="M 786 306 L 786 298 M 786 306 L 778 306"/>
  </g>

  <!-- ================= TOP SPEC BAR ================= -->
  <line x1="8" y1="36" x2="792" y2="36" stroke="#1F2430" stroke-width="1"/>

  <g class="mono" font-size="10" font-weight="600" letter-spacing="1">
    <!-- Left Spec ID -->
    <text x="24" y="25" fill="#71717A">SPEC.DOC // <tspan fill="#F3F4F6">THENEOTIC-2026</tspan></text>

    <!-- Center Status Indicator -->
    <text x="270" y="25" fill="#71717A">STATUS: [ </text>
    <circle cx="334" cy="22" r="3" fill="#10B981" class="status-pulse"/>
    <text x="344" y="25" fill="#10B981" font-weight="700">ONLINE // NOMINAL</text>
    <text x="472" y="25" fill="#71717A"> ]</text>

    <!-- Right Architecture -->
    <text x="580" y="25" fill="#71717A">ARCH: <tspan fill="#F3F4F6">DISTRIBUTED // POSIX</tspan></text>
  </g>

  <!-- ================= MAIN LEFT BLOCK ================= -->
  <g transform="translate(24, 0)">
    <!-- Red Overline Tag -->
    <text x="0" y="68" class="mono" font-size="11" font-weight="700" fill="#FF2A2A" letter-spacing="1.5">// SYSTEMS &amp; AI ARCHITECTURE</text>

    <!-- Main Identity Header -->
    <text x="0" y="108" class="sans" font-size="38" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      The-Neotic
      <tspan dx="10" class="mono" font-size="18" font-weight="500" fill="#94A3B8">@theneotic</tspan>
    </text>

    <!-- Hairline Accent -->
    <line x1="0" y1="120" x2="380" y2="120" stroke="#1F2430" stroke-width="1"/>
    <rect x="0" y="119" width="48" height="2" fill="url(#red-accent)"/>

    <!-- Concise Manifesto -->
    <text x="0" y="146" class="sans" font-size="13" font-weight="400" fill="#CBD5E1">
      Building local-first AI engines, zero-dependency web primitives,
    </text>
    <text x="0" y="166" class="sans" font-size="13" font-weight="400" fill="#CBD5E1">
      and real-time telemetry verified through inspectable source code.
    </text>

    <!-- Technical Hardware Pills -->
    <g transform="translate(0, 196)" class="mono" font-size="10" font-weight="600" letter-spacing="0.5">
      <!-- Pill 1: Systems -->
      <rect x="0" y="0" width="120" height="26" rx="3" fill="#111318" stroke="#1F2430" stroke-width="1"/>
      <circle cx="10" cy="13" r="2.5" fill="#FF2A2A"/>
      <text x="18" y="17" fill="#F3F4F6">C / PY / JVM</text>

      <!-- Pill 2: Web Engine with TS -->
      <rect x="126" y="0" width="126" height="26" rx="3" fill="#111318" stroke="#1F2430" stroke-width="1"/>
      <circle cx="136" cy="13" r="2.5" fill="#00E5FF"/>
      <text x="144" y="17" fill="#00E5FF">TS · 0-DEP JS</text>

      <!-- Pill 3: Data Stack -->
      <rect x="258" y="0" width="122" height="26" rx="3" fill="#111318" stroke="#1F2430" stroke-width="1"/>
      <circle cx="268" cy="13" r="2.5" fill="#10B981"/>
      <text x="276" y="17" fill="#10B981">SQL · STREAM</text>
    </g>

    <!-- Micro Spec Line -->
    <text x="0" y="248" class="mono" font-size="9" fill="#64748B" letter-spacing="0.8">
      CORE SPEC // 0-BLOAT GUARANTEE · DETERMINISTIC STATE
    </text>
  </g>

  <!-- ================= MAIN RIGHT BLOCK: TERMINAL HUD ================= -->
  <g transform="translate(425, 48)">
    <!-- Terminal Outer Frame -->
    <rect width="350" height="250" rx="4" fill="url(#term-bg)" stroke="#1F2430" stroke-width="1"/>

    <!-- Terminal Top Bar -->
    <rect width="350" height="28" rx="4" fill="#121620"/>
    <circle cx="16" cy="14" r="3.5" fill="#FF5F56"/>
    <circle cx="28" cy="14" r="3.5" fill="#FFBD2E"/>
    <circle cx="40" cy="14" r="3.5" fill="#27C93F"/>
    
    <text x="56" y="18" class="mono" font-size="9.5" font-weight="600" fill="#94A3B8" letter-spacing="0.8">sh // telemetry-exec --target=all</text>
    <text x="280" y="18" class="mono" font-size="9" font-weight="700" fill="#00E5FF">60Hz [LOCKED]</text>
    <line x1="0" y1="28" x2="350" y2="28" stroke="#1F2430" stroke-width="1"/>

    <!-- Terminal Inner Log Tree -->
    <g class="mono" font-size="10" line-height="1.6" letter-spacing="0.4">
      <text x="14" y="52" fill="#94A3B8">$ monolith --inspect --verify</text>
      
      <!-- Module 1: Oculus AI -->
      <text x="14" y="78" fill="#64748B">├─ [<tspan fill="#10B981" font-weight="700">OK</tspan>] kernel.ai.oculus</text>
      <text x="42" y="94" fill="#71717A" font-size="9">└─ weights: local · gaze: 12ms</text>

      <!-- Module 2: Monolith Vault -->
      <text x="14" y="120" fill="#64748B">├─ [<tspan fill="#10B981" font-weight="700">OK</tspan>] crypto.monolith_vault</text>
      <text x="42" y="136" fill="#71717A" font-size="9">└─ deps: 0 · cipher: WebCrypto</text>

      <!-- Module 3: F1 Telemetry -->
      <text x="14" y="162" fill="#64748B">├─ [<tspan fill="#10B981" font-weight="700">OK</tspan>] stream.f1_telemetry</text>
      <text x="42" y="178" fill="#71717A" font-size="9">└─ pipeline: 60Hz deterministic</text>

      <!-- Module 4: Clearcut Vision -->
      <text x="14" y="204" fill="#64748B">└─ [<tspan fill="#10B981" font-weight="700">OK</tspan>] runtime.clearcut_vision</text>
      <text x="42" y="220" fill="#71717A" font-size="9">└─ sandbox: browser-isolated</text>

      <!-- Prompt Line -->
      <text x="14" y="240" fill="#10B981" font-weight="700">&gt; <tspan fill="#F3F4F6">awaiting_instruction</tspan><tspan fill="#00E5FF" class="cursor">_</tspan></text>
    </g>
  </g>
</svg>
