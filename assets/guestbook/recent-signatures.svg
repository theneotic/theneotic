<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc"><title id="title">Recent approved guestbook signatures</title><desc id="desc">A midnight-gothic guestbook panel generated from approved public GitHub issues.</desc><defs><linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b14"/><stop offset="1" stop-color="#111b31"/></linearGradient></defs><rect width="960" height="210" rx="22" fill="url(#ink)"/><rect x="1" y="1" width="958" height="208" rx="21" fill="none" stroke="#334155"/><path d="M0 48 C130 18 218 80 342 48 S600 17 960 44" fill="none" stroke="#5967aa" stroke-opacity=".38"/><text x="32" y="42" fill="#e9efff" font-family="Georgia,serif" font-size="23" font-weight="700" letter-spacing="2">RECENT SIGNATURES</text><text x="770" y="41" fill="#8ea3d4" font-family="ui-monospace,monospace" font-size="10" letter-spacing="2">APPROVED LEDGER</text><g transform="translate(0 118)"><circle cx="42" cy="0" r="5" fill="#a78bfa"/><text x="60" y="-4" fill="#e9efff" font-family="Georgia,serif" font-size="19" font-weight="700">The ledger is open.</text><text x="60" y="22" fill="#a8b8e8" font-family="ui-sans-serif,system-ui" font-size="14">Be the first approved signature in the midnight guestbook.</text></g></svg>