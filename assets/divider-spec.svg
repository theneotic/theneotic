<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="12" viewBox="0 0 1060 12" role="img" aria-labelledby="title desc">
  <title id="title">Section Divider Spec</title>
  <desc id="desc">Hardware schematic horizontal divider with subtle tick marks and center calibration reticle.</desc>

  <defs>
    <style>
      @keyframes packet-slide {
        0% { transform: translateX(-30px); opacity: 0; }
        5% { opacity: 0.95; }
        95% { opacity: 0.95; }
        100% { transform: translateX(1100px); opacity: 0; }
      }
      .data-packet {
        animation: packet-slide 4.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1060" height="12" fill="#0A0B0E"/>

  <!-- Main 1px Structural Guideline -->
  <line x1="0" y1="6" x2="1060" y2="6" stroke="#1F2430" stroke-width="1"/>

  <!-- Endcaps -->
  <line x1="0" y1="2" x2="0" y2="10" stroke="#FF2A2A" stroke-width="1.5"/>
  <line x1="1060" y1="2" x2="1060" y2="10" stroke="#FF2A2A" stroke-width="1.5"/>

  <!-- Subtle Center Calibration Marker -->
  <circle cx="530" cy="6" r="2" fill="#0A0B0E" stroke="#FF2A2A" stroke-width="1"/>

  <!-- Minimal Glowing Telemetry Dot -->
  <circle cx="0" cy="6" r="2" fill="#FF2A2A" class="data-packet"/>
</svg>
