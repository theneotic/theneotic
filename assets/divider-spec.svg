<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="20" viewBox="0 0 1200 20" role="img" aria-labelledby="title desc">
  <title id="title">Section Divider Spec</title>
  <desc id="desc">Hardware schematic horizontal divider with tick telemetry and animated data packet.</desc>

  <defs>
    <style>
      @keyframes packet-slide {
        0% { transform: translateX(-60px); opacity: 0; }
        5% { opacity: 1; }
        95% { opacity: 1; }
        100% { transform: translateX(1260px); opacity: 0; }
      }
      .data-packet {
        animation: packet-slide 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
    </style>

    <linearGradient id="packet-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2A2A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF2A2A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="1"/>
    </linearGradient>

    <filter id="packet-glow" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="20" fill="#0A0B0E"/>

  <!-- Main 1px Structural Guideline -->
  <line x1="0" y1="10" x2="1200" y2="10" stroke="#1F2430" stroke-width="1"/>

  <!-- Left and Right Endcaps -->
  <line x1="0" y1="5" x2="0" y2="15" stroke="#FF2A2A" stroke-width="2"/>
  <line x1="1200" y1="5" x2="1200" y2="15" stroke="#FF2A2A" stroke-width="2"/>

  <!-- 100px Calibration Ticks -->
  <g stroke="#1F2430" stroke-width="1">
    <line x1="100" y1="7" x2="100" y2="13"/>
    <line x1="200" y1="7" x2="200" y2="13"/>
    <line x1="300" y1="7" x2="300" y2="13"/>
    <line x1="400" y1="7" x2="400" y2="13"/>
    <line x1="500" y1="7" x2="500" y2="13"/>
    <line x1="700" y1="7" x2="700" y2="13"/>
    <line x1="800" y1="7" x2="800" y2="13"/>
    <line x1="900" y1="7" x2="900" y2="13"/>
    <line x1="1000" y1="7" x2="1000" y2="13"/>
    <line x1="1100" y1="7" x2="1100" y2="13"/>
  </g>

  <!-- Center Crosshair and Specification Marker -->
  <g transform="translate(600, 10)">
    <circle cx="0" cy="0" r="3" fill="#0A0B0E" stroke="#FF2A2A" stroke-width="1"/>
    <circle cx="0" cy="0" r="1" fill="#FF2A2A"/>
    <line x1="-12" y1="0" x2="-5" y2="0" stroke="#FF2A2A" stroke-width="1"/>
    <line x1="5" y1="0" x2="12" y2="0" stroke="#FF2A2A" stroke-width="1"/>
  </g>

  <!-- Animated Glowing Telemetry Data Packet -->
  <g class="data-packet" filter="url(#packet-glow)">
    <rect x="0" y="8" width="48" height="4" rx="2" fill="url(#packet-grad)"/>
    <circle cx="48" cy="10" r="2" fill="#00E5FF"/>
  </g>
</svg>
