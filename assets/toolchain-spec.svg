<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc">
  <title id="title">The-Neotic // Systems Architecture &amp; Toolchain Specification</title>
  <desc id="desc">2x2 modular hardware rack detailing systems logic, client cryptography, data pipelines, and infrastructure runtimes.</desc>

  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulse-led {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      .led-pulse { animation: pulse-led 2s ease-in-out infinite; }
    </style>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="rack-dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#1F2430" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="640" height="320" fill="#0A0B0E"/>

  <!-- Technical Grid Overlay -->
  <rect x="6" y="6" width="628" height="308" rx="4" fill="url(#rack-dots)"/>

  <!-- Outer Spec Frame -->
  <rect x="6" y="6" width="628" height="308" rx="4" fill="none" stroke="#1F2430" stroke-width="1.2"/>

  <!-- ================= TOP SPEC BAR ================= -->
  <line x1="8" y1="30" x2="632" y2="30" stroke="#1F2430" stroke-width="1"/>

  <g class="mono" font-size="9.5" font-weight="600" letter-spacing="1">
    <text x="18" y="21" fill="#71717A">TOOLCHAIN.SPEC // <tspan fill="#F3F4F6">RUNTIME MATRIX</tspan></text>
    <text x="260" y="21" fill="#71717A">STATUS: [ </text>
    <circle cx="316" cy="18" r="2.5" fill="#10B981" class="led-pulse"/>
    <text x="324" y="21" fill="#10B981" font-weight="700">VERIFIED RUNTIME</text>
    <text x="442" y="21" fill="#71717A"> ]</text>
    <text x="480" y="21" fill="#71717A">STATE: <tspan fill="#00E5FF">100% DETERMINISTIC</tspan></text>
  </g>

  <!-- ================= BAY 01 // SYSTEMS & LOGIC (TOP-LEFT) ================= -->
  <g transform="translate(14, 38)">
    <rect width="300" height="130" rx="3" fill="#0D0F14" stroke="#1F2430" stroke-width="1"/>
    <text x="10" y="16" class="mono" font-size="9.5" font-weight="700" fill="#FF2A2A" letter-spacing="1">BAY 01 // SYSTEMS &amp; LOGIC</text>
    <line x1="8" y1="22" x2="292" y2="22" stroke="#1F2430" stroke-width="1"/>

    <!-- Chip 1: C -->
    <g transform="translate(8, 28)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#FF2A2A"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">C</text>
      <text x="30" y="14" class="mono" font-size="8.5" fill="#71717A">// MEMORY-SAFE / POSIX</text>
      <text x="256" y="14" class="mono" font-size="8.5" font-weight="600" fill="#10B981">[OK]</text>
    </g>

    <!-- Chip 2: Python -->
    <g transform="translate(8, 52)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#FF2A2A"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">PYTHON</text>
      <text x="60" y="14" class="mono" font-size="8.5" fill="#71717A">// LOCAL AI / AST</text>
      <text x="256" y="14" class="mono" font-size="8.5" font-weight="600" fill="#10B981">[OK]</text>
    </g>

    <!-- Chip 3: Java -->
    <g transform="translate(8, 76)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#FF2A2A"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">JAVA</text>
      <text x="44" y="14" class="mono" font-size="8.5" fill="#71717A">// FABRIC JVM HOOKS</text>
      <text x="256" y="14" class="mono" font-size="8.5" font-weight="600" fill="#10B981">[OK]</text>
    </g>

    <!-- Chip 4: Algorithms -->
    <g transform="translate(8, 100)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#FF2A2A"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">ALGORITHMS</text>
      <text x="88" y="14" class="mono" font-size="8.5" fill="#71717A">// STATE LOGIC</text>
      <text x="256" y="14" class="mono" font-size="8.5" font-weight="600" fill="#10B981">[OK]</text>
    </g>
  </g>

  <!-- ================= BAY 02 // WEB & CRYPTO (TOP-RIGHT) ================= -->
  <g transform="translate(326, 38)">
    <rect width="300" height="130" rx="3" fill="#0D0F14" stroke="#1F2430" stroke-width="1"/>
    <text x="10" y="16" class="mono" font-size="9.5" font-weight="700" fill="#00E5FF" letter-spacing="1">BAY 02 // WEB &amp; CRYPTO</text>
    <line x1="8" y1="22" x2="292" y2="22" stroke="#1F2430" stroke-width="1"/>

    <!-- Chip 1: TypeScript -->
    <g transform="translate(8, 28)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#00E5FF"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#00E5FF">TYPESCRIPT</text>
      <text x="82" y="14" class="mono" font-size="8.5" fill="#71717A">// STRICT TYPING</text>
      <text x="256" y="14" class="mono" font-size="8.5" font-weight="600" fill="#00E5FF">[TS]</text>
    </g>

    <!-- Chip 2: Vanilla JS -->
    <g transform="translate(8, 52)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#00E5FF"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">VANILLA JS</text>
      <text x="80" y="14" class="mono" font-size="8.5" fill="#71717A">// 0-DEP PRISTINE</text>
      <text x="256" y="14" class="mono" font-size="8.5" font-weight="600" fill="#10B981">[OK]</text>
    </g>

    <!-- Chip 3: WebCrypto -->
    <g transform="translate(8, 76)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#00E5FF"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">WEBCRYPTO</text>
      <text x="78" y="14" class="mono" font-size="8.5" fill="#71717A">// CLIENT CIPHER</text>
      <text x="250" y="14" class="mono" font-size="8.5" font-weight="600" fill="#00E5FF">[SHA]</text>
    </g>

    <!-- Chip 4: Canvas HUD -->
    <g transform="translate(8, 100)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#00E5FF"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">CANVAS HUD</text>
      <text x="80" y="14" class="mono" font-size="8.5" fill="#71717A">// 60HZ STREAM</text>
      <text x="250" y="14" class="mono" font-size="8.5" font-weight="600" fill="#00E5FF">[60H]</text>
    </g>
  </g>

  <!-- ================= BAY 03 // DATA & PIPELINES (BOTTOM-LEFT) ================= -->
  <g transform="translate(14, 176)">
    <rect width="300" height="130" rx="3" fill="#0D0F14" stroke="#1F2430" stroke-width="1"/>
    <text x="10" y="16" class="mono" font-size="9.5" font-weight="700" fill="#10B981" letter-spacing="1">BAY 03 // DATA &amp; PIPELINES</text>
    <line x1="8" y1="22" x2="292" y2="22" stroke="#1F2430" stroke-width="1"/>

    <!-- Chip 1: PostgreSQL -->
    <g transform="translate(8, 28)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#10B981"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">POSTGRESQL</text>
      <text x="86" y="14" class="mono" font-size="8.5" fill="#71717A">// ACID SCHEMA</text>
      <text x="254" y="14" class="mono" font-size="8.5" font-weight="600" fill="#10B981">[SQL]</text>
    </g>

    <!-- Chip 2: Supabase -->
    <g transform="translate(8, 52)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#10B981"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">SUPABASE</text>
      <text x="70" y="14" class="mono" font-size="8.5" fill="#71717A">// REALTIME / RLS</text>
      <text x="256" y="14" class="mono" font-size="8.5" font-weight="600" fill="#10B981">[OK]</text>
    </g>

    <!-- Chip 3: MongoDB -->
    <g transform="translate(8, 76)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#10B981"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">MONGODB</text>
      <text x="66" y="14" class="mono" font-size="8.5" fill="#71717A">// DOCUMENT CLUST</text>
      <text x="256" y="14" class="mono" font-size="8.5" font-weight="600" fill="#10B981">[OK]</text>
    </g>

    <!-- Chip 4: Telemetry -->
    <g transform="translate(8, 100)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#10B981"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">TELEMETRY</text>
      <text x="76" y="14" class="mono" font-size="8.5" fill="#71717A">// BUFFER PIPELINE</text>
      <text x="252" y="14" class="mono" font-size="8.5" font-weight="600" fill="#10B981">[RAW]</text>
    </g>
  </g>

  <!-- ================= BAY 04 // PLATFORM & INFRA (BOTTOM-RIGHT) ================= -->
  <g transform="translate(326, 176)">
    <rect width="300" height="130" rx="3" fill="#0D0F14" stroke="#1F2430" stroke-width="1"/>
    <text x="10" y="16" class="mono" font-size="9.5" font-weight="700" fill="#94A3B8" letter-spacing="1">BAY 04 // PLATFORM &amp; INFRA</text>
    <line x1="8" y1="22" x2="292" y2="22" stroke="#1F2430" stroke-width="1"/>

    <!-- Chip 1: Linux -->
    <g transform="translate(8, 28)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#94A3B8"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">LINUX</text>
      <text x="46" y="14" class="mono" font-size="8.5" fill="#71717A">// POSIX ENVIRONMENT</text>
      <text x="256" y="14" class="mono" font-size="8.5" font-weight="600" fill="#10B981">[OK]</text>
    </g>

    <!-- Chip 2: Docker -->
    <g transform="translate(8, 52)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#94A3B8"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">DOCKER</text>
      <text x="54" y="14" class="mono" font-size="8.5" fill="#71717A">// HERMETIC BUILDS</text>
      <text x="256" y="14" class="mono" font-size="8.5" font-weight="600" fill="#10B981">[OK]</text>
    </g>

    <!-- Chip 3: Git -->
    <g transform="translate(8, 76)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#94A3B8"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">GIT</text>
      <text x="34" y="14" class="mono" font-size="8.5" fill="#71717A">// ATOMIC DISPATCH</text>
      <text x="256" y="14" class="mono" font-size="8.5" font-weight="600" fill="#10B981">[OK]</text>
    </g>

    <!-- Chip 4: CI/CD -->
    <g transform="translate(8, 100)">
      <rect width="284" height="21" rx="2" fill="#13161F" stroke="#1E2433" stroke-width="1"/>
      <rect width="3" height="21" rx="1" fill="#94A3B8"/>
      <text x="10" y="14" class="mono" font-size="10" font-weight="700" fill="#F3F4F6">CI / CD</text>
      <text x="52" y="14" class="mono" font-size="8.5" fill="#71717A">// ACTIONS PIPELINE</text>
      <text x="250" y="14" class="mono" font-size="8.5" font-weight="600" fill="#00E5FF">[RUN]</text>
    </g>
  </g>
</svg>
