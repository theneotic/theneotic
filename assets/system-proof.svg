<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="130" viewBox="0 0 1060 130" role="img" aria-labelledby="title desc">
  <title id="title">The-Neotic // Architectural Standards Spec Strip</title>
  <desc id="desc">Horizontal engineering standards matrix documenting zero-bloat web, local AI, database pipelines, and cryptographic determinism.</desc>

  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1060" height="130" fill="#0A0B0E"/>

  <!-- Outer Spec Frame -->
  <rect x="10" y="10" width="1040" height="110" rx="4" fill="#0E1015" stroke="#1F2430" stroke-width="1.2"/>

  <!-- Column Separators -->
  <line x1="270" y1="18" x2="270" y2="112" stroke="#1F2430" stroke-width="1"/>
  <line x1="530" y1="18" x2="530" y2="112" stroke="#1F2430" stroke-width="1"/>
  <line x1="790" y1="18" x2="790" y2="112" stroke="#1F2430" stroke-width="1"/>

  <!-- ================= COLUMN 01 ================= -->
  <g transform="translate(26, 0)">
    <text x="0" y="38" class="mono" font-size="10.5" font-weight="700" fill="#00E5FF" letter-spacing="1">STD_01 // ZERO-BLOAT WEB</text>
    <text x="0" y="60" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">TypeScript &amp; Vanilla JS</text>
    <text x="0" y="78" class="sans" font-size="11.5" fill="#94A3B8">Semantic HTML5, custom CSS, 0-dep</text>
    <g transform="translate(0, 88)">
      <circle cx="3" cy="6" r="3" fill="#10B981"/>
      <text x="12" y="10" class="mono" font-size="10" font-weight="700" fill="#10B981" letter-spacing="0.5">[ 0 UNNECESSARY DEPS ]</text>
    </g>
  </g>

  <!-- ================= COLUMN 02 ================= -->
  <g transform="translate(286, 0)">
    <text x="0" y="38" class="mono" font-size="10.5" font-weight="700" fill="#FF2A2A" letter-spacing="1">STD_02 // LOCAL-FIRST AI</text>
    <text x="0" y="60" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">Decoupled Python &amp; Vision</text>
    <text x="0" y="78" class="sans" font-size="11.5" fill="#94A3B8">Local model weights, zero-cloud lag</text>
    <g transform="translate(0, 88)">
      <circle cx="3" cy="6" r="3" fill="#00E5FF"/>
      <text x="12" y="10" class="mono" font-size="10" font-weight="700" fill="#00E5FF" letter-spacing="0.5">[ LOCAL EXECUTION ]</text>
    </g>
  </g>

  <!-- ================= COLUMN 03 ================= -->
  <g transform="translate(546, 0)">
    <text x="0" y="38" class="mono" font-size="10.5" font-weight="700" fill="#10B981" letter-spacing="1">STD_03 // DATA INTEGRITY</text>
    <text x="0" y="60" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">SQL Schemas &amp; Realtime</text>
    <text x="0" y="78" class="sans" font-size="11.5" fill="#94A3B8">Supabase channels, normalized tables</text>
    <g transform="translate(0, 88)">
      <circle cx="3" cy="6" r="3" fill="#10B981"/>
      <text x="12" y="10" class="mono" font-size="10" font-weight="700" fill="#10B981" letter-spacing="0.5">[ STRICT AUDIT ]</text>
    </g>
  </g>

  <!-- ================= COLUMN 04 ================= -->
  <g transform="translate(806, 0)">
    <text x="0" y="38" class="mono" font-size="10.5" font-weight="700" fill="#FF2A2A" letter-spacing="1">STD_04 // DETERMINISM</text>
    <text x="0" y="60" class="sans" font-size="13" font-weight="700" fill="#FFFFFF">Cryptography &amp; Telemetry</text>
    <text x="0" y="78" class="sans" font-size="11.5" fill="#94A3B8">WebCrypto math, 60Hz canvas streams</text>
    <g transform="translate(0, 88)">
      <circle cx="3" cy="6" r="3" fill="#FF2A2A"/>
      <text x="12" y="10" class="mono" font-size="10" font-weight="700" fill="#FF2A2A" letter-spacing="0.5">[ INSPECTABLE SOURCE ]</text>
    </g>
  </g>
</svg>
