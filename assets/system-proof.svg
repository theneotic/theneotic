<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">The-Neotic // Architectural Standards &amp; Capabilities Matrix</title>
  <desc id="desc">2x2 systems architecture spec matrix highlighting zero-bloat web, local AI, database pipelines, and cryptographic performance.</desc>

  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>

    <!-- 24px Technical Dot Matrix Pattern -->
    <pattern id="matrix-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#1F2430" opacity="0.6"/>
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#0E1016"/>
    </linearGradient>

    <!-- Red Accent Gradient -->
    <linearGradient id="red-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2A2A"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="#0A0B0E"/>

  <!-- Blueprint Dot Grid Overlay -->
  <rect width="1200" height="420" fill="url(#matrix-dots)"/>

  <!-- Outer Guide Border -->
  <rect x="15" y="15" width="1170" height="390" fill="none" stroke="#1F2430" stroke-width="1.2"/>

  <!-- Registration Marks -->
  <g stroke="#64748B" stroke-width="1" fill="none">
    <path d="M 20 20 L 20 30 M 20 20 L 30 20"/>
    <path d="M 1180 20 L 1180 30 M 1180 20 L 1170 20"/>
    <path d="M 20 400 L 20 390 M 20 400 L 30 400"/>
    <path d="M 1180 400 L 1180 390 M 1180 400 L 1170 400"/>
  </g>

  <!-- ================= CARD 01: STD_01 ================= -->
  <g transform="translate(30, 30)">
    <!-- Card Frame -->
    <rect width="555" height="165" rx="4" fill="url(#card-grad)" stroke="#1F2430" stroke-width="1.2"/>

    <!-- Top Accent Line -->
    <rect x="0" y="0" width="60" height="2.5" fill="#00E5FF"/>
    <line x1="60" y1="1" x2="555" y2="1" stroke="#1F2430" stroke-width="1"/>

    <!-- Corner Crosshairs -->
    <path d="M 545 10 L 545 16 M 542 13 L 548 13" stroke="#64748B" stroke-width="1"/>

    <!-- Header and Spec ID -->
    <text x="20" y="32" class="mono" font-size="10.5" font-weight="700" fill="#00E5FF" letter-spacing="1.5">// ARCHITECTURAL DISCIPLINE</text>
    <text x="460" y="32" class="mono" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">STD_01</text>

    <!-- Card Title -->
    <text x="20" y="58" class="sans" font-size="17" font-weight="700" fill="#F3F4F6" letter-spacing="-0.2">ZERO-BLOAT FRONTEND ARCHITECTURE</text>

    <!-- Description -->
    <text x="20" y="82" class="sans" font-size="12" fill="#9CA3AF" letter-spacing="0.1">
      Mastering semantic HTML5, custom CSS variable systems, and pure Vanilla JS
    </text>
    <text x="20" y="99" class="sans" font-size="12" fill="#9CA3AF" letter-spacing="0.1">
      state management before reaching for heavy third-party framework overhead.
    </text>

    <!-- Footer Spec and Metric Pill -->
    <line x1="20" y1="118" x2="535" y2="118" stroke="#1F2430" stroke-width="1"/>

    <g transform="translate(20, 128)">
      <!-- Pill Box -->
      <rect x="0" y="0" width="225" height="24" rx="3" fill="#07080A" stroke="#1F2430" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#10B981"/>
      <text x="22" y="16" class="mono" font-size="10" font-weight="700" fill="#10B981" letter-spacing="0.8">[ 0 UNNECESSARY DEPENDENCIES ]</text>

      <!-- Tech Stack Tags -->
      <text x="240" y="16" class="mono" font-size="10" fill="#64748B" letter-spacing="0.8">SEMANTIC HTML5 • CSS3 • ES6+</text>
    </g>
  </g>

  <!-- ================= CARD 02: STD_02 ================= -->
  <g transform="translate(615, 30)">
    <!-- Card Frame -->
    <rect width="555" height="165" rx="4" fill="url(#card-grad)" stroke="#1F2430" stroke-width="1.2"/>

    <!-- Top Accent Line -->
    <rect x="0" y="0" width="60" height="2.5" fill="#FF2A2A"/>
    <line x1="60" y1="1" x2="555" y2="1" stroke="#1F2430" stroke-width="1"/>

    <!-- Corner Crosshairs -->
    <path d="M 545 10 L 545 16 M 542 13 L 548 13" stroke="#64748B" stroke-width="1"/>

    <!-- Header and Spec ID -->
    <text x="20" y="32" class="mono" font-size="10.5" font-weight="700" fill="#FF2A2A" letter-spacing="1.5">// AUTONOMOUS SYSTEMS</text>
    <text x="460" y="32" class="mono" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">STD_02</text>

    <!-- Card Title -->
    <text x="20" y="58" class="sans" font-size="17" font-weight="700" fill="#F3F4F6" letter-spacing="-0.2">LOCAL-FIRST AI &amp; MODULAR ORCHESTRATION</text>

    <!-- Description -->
    <text x="20" y="82" class="sans" font-size="12" fill="#9CA3AF" letter-spacing="0.1">
      Designing decoupled Python and local-model pipelines where inference modules,
    </text>
    <text x="20" y="99" class="sans" font-size="12" fill="#9CA3AF" letter-spacing="0.1">
      vision inputs, and UI layers communicate via clean, deterministic contracts.
    </text>

    <!-- Footer Spec and Metric Pill -->
    <line x1="20" y1="118" x2="535" y2="118" stroke="#1F2430" stroke-width="1"/>

    <g transform="translate(20, 128)">
      <!-- Pill Box -->
      <rect x="0" y="0" width="242" height="24" rx="3" fill="#07080A" stroke="#1F2430" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#00E5FF"/>
      <text x="22" y="16" class="mono" font-size="10" font-weight="700" fill="#00E5FF" letter-spacing="0.8">[ LOCAL EXECUTION // LOW LATENCY ]</text>

      <!-- Tech Stack Tags -->
      <text x="256" y="16" class="mono" font-size="10" fill="#64748B" letter-spacing="0.8">PYTHON • LOCAL LLMS • OPENCV</text>
    </g>
  </g>

  <!-- ================= CARD 03: STD_03 ================= -->
  <g transform="translate(30, 225)">
    <!-- Card Frame -->
    <rect width="555" height="165" rx="4" fill="url(#card-grad)" stroke="#1F2430" stroke-width="1.2"/>

    <!-- Top Accent Line -->
    <rect x="0" y="0" width="60" height="2.5" fill="#10B981"/>
    <line x1="60" y1="1" x2="555" y2="1" stroke="#1F2430" stroke-width="1"/>

    <!-- Corner Crosshairs -->
    <path d="M 545 10 L 545 16 M 542 13 L 548 13" stroke="#64748B" stroke-width="1"/>

    <!-- Header and Spec ID -->
    <text x="20" y="32" class="mono" font-size="10.5" font-weight="700" fill="#10B981" letter-spacing="1.5">// PERSISTENCE ARCHITECTURE</text>
    <text x="460" y="32" class="mono" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">STD_03</text>

    <!-- Card Title -->
    <text x="20" y="58" class="sans" font-size="17" font-weight="700" fill="#F3F4F6" letter-spacing="-0.2">RELATIONAL &amp; CLOUD DATA INTEGRITY</text>

    <!-- Description -->
    <text x="20" y="82" class="sans" font-size="12" fill="#9CA3AF" letter-spacing="0.1">
      Structuring normalized SQL schemas, Supabase real-time backends, and
    </text>
    <text x="20" y="99" class="sans" font-size="12" fill="#9CA3AF" letter-spacing="0.1">
      MongoDB document stores with strict query efficiency and zero leakage.
    </text>

    <!-- Footer Spec and Metric Pill -->
    <line x1="20" y1="118" x2="535" y2="118" stroke="#1F2430" stroke-width="1"/>

    <g transform="translate(20, 128)">
      <!-- Pill Box -->
      <rect x="0" y="0" width="205" height="24" rx="3" fill="#07080A" stroke="#1F2430" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#10B981"/>
      <text x="22" y="16" class="mono" font-size="10" font-weight="700" fill="#10B981" letter-spacing="0.8">[ SQL • SUPABASE • MONGODB ]</text>

      <!-- Tech Stack Tags -->
      <text x="220" y="16" class="mono" font-size="10" fill="#64748B" letter-spacing="0.8">POSTGRESQL • REALTIME WEBSOCKETS</text>
    </g>
  </g>

  <!-- ================= CARD 04: STD_04 ================= -->
  <g transform="translate(615, 225)">
    <!-- Card Frame -->
    <rect width="555" height="165" rx="4" fill="url(#card-grad)" stroke="#1F2430" stroke-width="1.2"/>

    <!-- Top Accent Line -->
    <rect x="0" y="0" width="60" height="2.5" fill="#FF2A2A"/>
    <line x1="60" y1="1" x2="555" y2="1" stroke="#1F2430" stroke-width="1"/>

    <!-- Corner Crosshairs -->
    <path d="M 545 10 L 545 16 M 542 13 L 548 13" stroke="#64748B" stroke-width="1"/>

    <!-- Header and Spec ID -->
    <text x="20" y="32" class="mono" font-size="10.5" font-weight="700" fill="#FF2A2A" letter-spacing="1.5">// CRYPTOGRAPHY &amp; HARDWARE</text>
    <text x="460" y="32" class="mono" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1">STD_04</text>

    <!-- Card Title -->
    <text x="20" y="58" class="sans" font-size="17" font-weight="700" fill="#F3F4F6" letter-spacing="-0.2">DETERMINISTIC PERFORMANCE &amp; SECURITY</text>

    <!-- Description -->
    <text x="20" y="82" class="sans" font-size="12" fill="#9CA3AF" letter-spacing="0.1">
      Implementing client-side cryptographic entropy validation, high-frequency
    </text>
    <text x="20" y="99" class="sans" font-size="12" fill="#9CA3AF" letter-spacing="0.1">
      telemetry rendering, and memory-conscious C/Java routines without frame drops.
    </text>

    <!-- Footer Spec and Metric Pill -->
    <line x1="20" y1="118" x2="535" y2="118" stroke="#1F2430" stroke-width="1"/>

    <g transform="translate(20, 128)">
      <!-- Pill Box -->
      <rect x="0" y="0" width="235" height="24" rx="3" fill="#07080A" stroke="#1F2430" stroke-width="1"/>
      <circle cx="12" cy="12" r="3" fill="#FF2A2A"/>
      <text x="22" y="16" class="mono" font-size="10" font-weight="700" fill="#FF2A2A" letter-spacing="0.8">[ AUDITED &amp; INSPECTABLE CODE ]</text>

      <!-- Tech Stack Tags -->
      <text x="250" y="16" class="mono" font-size="10" fill="#64748B" letter-spacing="0.8">WEBCRYPTO • 60HZ TELEMETRY • JVM</text>
    </g>
  </g>
</svg>
